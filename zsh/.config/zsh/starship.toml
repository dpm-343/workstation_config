"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$username$hostname$os$directory$git_branch$git_status$python$line_break$character"

[os]
disabled = false
format = "[$symbol](#blue) "

[os.symbols]
Ubuntu  = "󰕈"
Artix   = "󰣇"
Arch    = "󰣇"
CachyOS = "󰣇"
Macos   = ""

[directory]
format            = "[$path](bold blue)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo  = true

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[hostname]
ssh_only = true
ssh_symbol = "🌐"
trim_at = "."
detect_env_vars = []
format = "[$ssh_symbol$hostname]($style) "
style = "green dimmed bold"
disabled = false

[hostname.aliases]

[username]
detect_env_vars = []
format = "[$user]($style)"
style_root = "red bold"
style_user = "yellow bold"
show_always = false
disabled = false

[username.aliases]
"mjodom" = ""

[line_break]
disabled = false

[python]
#symbol = ""
#format = "[$symbol$version](green) "
format = "[${symbol}${version} (\\($virtualenv\\))]($style) "
style = "bold green"

[nodejs]
symbol = ""
format = "[$symbol $version](green) "

[rust]
symbol = ""
format = "[$symbol $version](red) "

[golang]
symbol = ""
format = "[$symbol $version](cyan) "

[php]
symbol = ""
format = "[$symbol $version](purple) "

[character]
success_symbol = "[└─>](green)"
error_symbol   = "[└─>](red)"
vimcmd_symbol  = "[└─<](blue)"
